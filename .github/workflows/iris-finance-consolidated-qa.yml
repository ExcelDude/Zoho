name: Iris Consolidated Finance QA (NO POSTING)
on:
  push:
    branches:
      - iris-finance-consolidated-qa-v1
  pull_request:
    paths:
      - 'iris-finance/**'
      - '.github/workflows/iris-finance-consolidated-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconciliation engine and Books evidence adapter tests (synthetic)
        run: |
          cd iris-finance/trust_reconciliation_v2
          python -m unittest discover -v
  finance-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: iris_trust_ephemeral_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-ephemeral-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iris_trust_ephemeral_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IRIS_TEST_DB_DISPOSABLE: 'true'
      IRIS_TEST_DATABASE_URL: postgresql://postgres:test-only-ephemeral-password@localhost:5432/iris_trust_ephemeral_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CI-only PostgreSQL client
        run: npm install --no-save --ignore-scripts --no-package-lock pg@8.13.1
      - name: Basic rent and owner controls
        run: |
          node iris-finance/trust/rent_trust_ledger.test.mjs
          node iris-finance/trust-persistence/rent_payment_exceptions.test.mjs
          node iris-finance/trust-persistence/multiowner_allocation.test.mjs
          node iris-finance/trust-persistence/multiowner_finance_bridge.test.mjs
      - name: Fee, identity and statement review controls
        run: |
          node iris-finance/trust-persistence/owner_fee_statement_bridge.test.mjs
          node iris-finance/trust-persistence/fee_statement_readiness.test.mjs
      - name: Persistent transaction and exception controls (mock)
        run: node iris-finance/trust-persistence/trust_event_store.test.mjs
      - name: PostgreSQL actual transactions, constraints and concurrency
        run: |
          node iris-finance/trust-persistence/trust_event_store.pg.test.mjs
          node iris-finance/trust-persistence/multiowner_store.pg.test.mjs
          node iris-finance/trust-persistence/rent_arrears_store.pg.test.mjs
          node iris-finance/trust-persistence/finance_source_bridge.pg.test.mjs
