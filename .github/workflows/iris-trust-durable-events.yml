name: Iris Trust Durable Event Store
on:
  push:
    branches:
      - iris-trust-durable-events-v1
  pull_request:
    paths:
      - 'iris-finance/trust-persistence/**'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test review-only trust persistence and exception queue
        run: node iris-finance/trust-persistence/trust_event_store.test.mjs
